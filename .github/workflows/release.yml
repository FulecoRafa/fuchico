name: Release

# Pushing a tag like v0.2.0 builds the native app for every platform and
# publishes a GitHub Release with the installers attached (issues #31–#33).
# The tag must match the version in tauri.conf.json (see scripts/set-version.mjs).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfontconfig1-dev libfreetype-dev libssl-dev \
            libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Unsigned builds for now (issue #31). To sign + notarize on macOS add
      # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets and
      # forward them in `env:` below — tauri-action picks them up by name.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Fuchico ${{ github.ref_name }}
          releaseBody: |
            Native builds for macOS, Linux and Windows. See the assets below.

            **macOS:** the app is not signed yet. After moving it to Applications run
            `xattr -dr com.apple.quarantine /Applications/Fuchico.app` once, or
            right-click › Open on first launch.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # Updates Casks/fuchico.rb in FulecoRafa/homebrew-tap with the new version
  # and dmg checksums (issue #34). Needs the HOMEBREW_TAP_TOKEN secret: a
  # fine-grained PAT with "Contents: write" on the tap repository. Skipped
  # silently when the secret is absent.
  homebrew:
    name: Update Homebrew tap
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - name: Compute dmg checksums from the release assets
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir dmgs
          ARM=$(sha256sum dmgs/Fuchico_${VERSION}_aarch64.dmg | cut -d' ' -f1)
          INTEL=$(sha256sum dmgs/Fuchico_${VERSION}_x64.dmg | cut -d' ' -f1)
          sed -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
              -e "s/arm:   \".*\"/arm:   \"${ARM}\"/" \
              -e "s/intel: \".*\"/intel: \"${INTEL}\"/" \
              packaging/homebrew/fuchico.rb > fuchico.rb
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Push cask to the tap
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/FulecoRafa/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp fuchico.rb tap/Casks/fuchico.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/fuchico.rb
          git commit -m "fuchico ${VERSION}" || echo "cask unchanged"
          git push

  # Submits the new version to microsoft/winget-pkgs (issue #35). Needs the
  # WINGET_TOKEN secret (classic PAT with public_repo) and an already
  # accepted first manifest; see packaging/winget/README.md.
  winget:
    name: Submit to winget
    needs: build
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Update manifest via wingetcreate
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Fuchico_${version}_x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update FulecoRafa.Fuchico --version $version --urls $url --submit --token $env:WINGET_TOKEN
